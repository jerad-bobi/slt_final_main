{% extends 'base.html' %}

{% load static %}

{% block title %}Learn Vocabularies{% endblock %}

{% block content %}
<main class="hero-section vocabulary-page" aria-label="Learn vocabularies page">
	<section class="dictionary-hero">
		<div>
			<p class="page-label">Vocab ⌕</p>
			<h1 class="page-title">Search English words for sign results.</h1>
			<p class="page-description">Words, letters, numbers.</p>
		</div>
		<div class="dictionary-hero__badge">ASL ⌕</div>
	</section>

	<section class="dictionary-shell" data-lookup-url="{% url 'signasl_lookup' %}">
		<form class="dictionary-search" id="dictionary-search-form">
			<label class="visually-hidden" for="dictionary-search-input">Search English words</label>
			<input
				id="dictionary-search-input"
				class="dictionary-search__input"
				type="search"
				name="query"
				placeholder="One word, letter, or number"
				autocomplete="off"
				spellcheck="false"
			>
			<button class="dictionary-search__button" type="submit">⌕ Search</button>
		</form>

		<section class="dictionary-results" aria-live="polite">
			<div class="dictionary-results__header">
				<h2 id="dictionary-results-title">Results</h2>
				<span id="dictionary-results-meta">Idle</span>
			</div>
			<div class="dictionary-results__body" id="dictionary-results-body">
				<div class="dictionary-empty-state">
					Search a word to see sign results.
				</div>
			</div>
		</section>
	</section>
</main>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/learn_vocabularies.js' %}"></script>
{% endblock %}
