{% extends 'base.html' %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block body_class %}page--generic{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/page.css' %}">
{% endblock %}

{% block content %}
<section class="generic-page" aria-label="{{ page_title }} page">
    <article class="panel-surface panel-surface--hero generic-page__hero">
        <p class="eyebrow">In progress</p>
        <h1 class="display-title">{{ page_title }}</h1>
        <p class="lead-copy">{{ page_description }}</p>
    </article>
</section>
{% endblock %}
